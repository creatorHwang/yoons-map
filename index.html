<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>YOONS MAPs — 윤선생</title>
<style>
  :root{
    --pine:#2f5d50; --pine-dark:#1c3d34; --pine-soft:#e6efe9;
    --ink:#1c2431; --muted:#6b7280; --line:#e3e6df; --bg:#f6f7f4;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;font-family:-apple-system,'Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink)}
  #app{display:flex;flex-direction:column;height:100vh}

  header{background:#fff;border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;z-index:20}
  header h1{font-size:16px;font-weight:800;margin:0;color:var(--pine-dark);white-space:nowrap}
  header .count{font-size:12.5px;color:var(--muted);white-space:nowrap}
  .search-box{position:relative;flex:1;min-width:220px;max-width:380px;display:flex;gap:6px}
  .search-box input{flex:1;min-width:0;box-sizing:border-box;border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13.5px;font-family:inherit}
  .search-box input:focus{outline:none;border-color:var(--pine)}
  .search-btn{flex:none;border:none;background:var(--pine);color:#fff;border-radius:8px;padding:0 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
  .search-btn:hover{background:var(--pine-dark)}
  .search-results{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.12);max-height:340px;overflow-y:auto;z-index:50;display:none}
  .search-item{padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
  .search-item:last-child{border-bottom:none}
  .search-item:hover{background:var(--pine-soft)}
  .search-item b{color:var(--ink)}
  .search-item span{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
  .search-divider{padding:5px 12px;font-size:10.5px;color:var(--muted);background:var(--bg);font-weight:800}

  .bm-filters{display:flex;gap:6px;flex-wrap:wrap}
  .bm-select{border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;font-weight:700;font-family:inherit;background:#fff;color:var(--ink);cursor:pointer}
  .bm-select:focus{outline:none;border-color:var(--pine)}
  .bm-chip{border:1px solid var(--line);border-radius:14px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;background:#fff;color:var(--ink);white-space:nowrap}
  .bm-chip.active{color:#fff;border-color:transparent}

  #mapWrap{position:relative;flex:1}
  #map{position:absolute;inset:0}

  .marker-box{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#fff;border:2px solid var(--pine);border-radius:8px;
    padding:3px 8px 4px;box-shadow:0 2px 6px rgba(0,0,0,.18);
    white-space:nowrap;cursor:pointer;transform:translate(-50%,-100%);
    position:relative;
  }
  .marker-box.sus{opacity:.5;filter:grayscale(.75);border-style:dashed}
  .marker-box.rem{opacity:.38;filter:grayscale(1);border-style:dotted}
  .marker-tag{display:inline-block;margin-left:4px;padding:0 4px;border-radius:6px;background:#6b7280;color:#fff;font-size:10px;font-weight:700}
  .marker-box::after{
    content:'';position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);
    border-left:6px solid transparent;border-right:6px solid transparent;border-top:7px solid var(--pine);
  }
  .marker-bm{font-size:9.5px;font-weight:700;color:var(--muted);line-height:1.1}
  .marker-name{font-size:12.5px;font-weight:800;color:var(--ink);line-height:1.2}

  .cluster-box{
    display:flex;align-items:center;justify-content:center;
    width:44px;height:44px;border-radius:50%;
    background:var(--pine);color:#fff;font-weight:800;font-size:13px;
    box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer;
    transform:translate(-50%,-50%);border:3px solid #fff;
  }

  .status-banner{position:absolute;top:12px;left:50%;transform:translateX(-50%);
    background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 18px;
    font-size:13px;color:var(--muted);box-shadow:0 4px 12px rgba(0,0,0,.1);z-index:15}
  .status-banner.error{color:#c0392b;border-color:#f3c9c4;background:#fdeeec}

  .legend{position:absolute;bottom:16px;left:16px;background:#fff;border:1px solid var(--line);
    border-radius:8px;padding:10px 14px;font-size:11.5px;color:var(--muted);box-shadow:0 4px 12px rgba(0,0,0,.1);z-index:15}
  .legend div{display:flex;align-items:center;gap:6px;margin-top:3px}
  .legend .dot{width:9px;height:9px;border-radius:50%;flex:none}

  /* 거리·면적·반경 재기 + 지적편집도 도구 패널 */
  .tool-panel{position:absolute;bottom:16px;right:16px;background:#fff;border:1px solid var(--line);
    border-radius:8px;padding:8px;box-shadow:0 4px 12px rgba(0,0,0,.12);z-index:16;
    display:flex;flex-direction:column;gap:4px;min-width:112px}
  .tool-btn{border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:12px;font-weight:700;
    cursor:pointer;background:#fff;color:var(--ink);white-space:nowrap;text-align:left;font-family:inherit}
  .tool-btn:hover{background:var(--pine-soft)}
  .tool-btn.active{background:var(--pine);color:#fff;border-color:var(--pine)}
  .measure-result{font-size:12px;font-weight:800;color:var(--pine-dark);padding:2px 2px 4px;display:none}
  .measure-hint{font-size:10.5px;color:var(--muted);padding:0 2px 4px;display:none}
  .measure-label{background:#1c2431;color:#fff;font-size:11.5px;font-weight:800;padding:3px 9px;
    border-radius:6px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.25);transform:translate(10px,-8px)}

  .terr-box{display:none;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px;line-height:1.5;max-width:230px}
  .terr-box b{color:var(--pine)}
  .terr-box .row{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
  .terr-box input[type=number]{width:80px;padding:4px;border:1px solid var(--line);border-radius:4px;font-size:12px}
  .tool-btn.danger{color:#b91c1c}
  .tool-btn.hidden{display:none}
  .view-modes{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  .view-modes .tool-btn{padding:5px 10px;border-radius:14px}
  .m-x{margin-left:8px;cursor:pointer;color:#fca5a5;font-weight:900}
  .m-x:hover{color:#fff}
  .ctx-menu{position:absolute;z-index:40;background:#fff;border:1px solid var(--line);border-radius:8px;
    box-shadow:0 6px 18px rgba(0,0,0,.22);padding:4px;min-width:200px;font-size:12.5px}
  .ctx-item{padding:8px 12px;border-radius:6px;cursor:pointer;font-weight:700;white-space:nowrap}
  .ctx-item:hover{background:var(--pine-soft)}
  .ctx-item.danger{color:#b91c1c}
  .ctx-body{padding:8px 10px;line-height:1.6;max-width:280px;white-space:normal}
  .ctx-body input,.ctx-body select{width:100%;margin:3px 0 6px;padding:6px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;font-family:inherit}
  .ctx-body .row{display:flex;gap:6px}
  .ctx-body .tool-btn{flex:1;text-align:center}
  .planned-box{display:flex;flex-direction:column;align-items:center;background:#fff;border:2px dashed #e11d48;border-radius:8px;
    padding:3px 8px 4px;box-shadow:0 2px 6px rgba(0,0,0,.18);white-space:nowrap;cursor:pointer;transform:translate(-50%,-100%)}
  .planned-box .marker-bm{color:#e11d48}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>📍 YOONS MAPs</h1>
    <span class="count" id="countLabel">불러오는 중…</span>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="🔍 센터명·주소·아파트·학교 등으로 찾기" oninput="onSearchInput(this.value)"
        onkeydown="if(event.key==='Escape'){this.value='';onSearchInput('');} if(event.key==='Enter'){onSearchSubmit();}">
      <button class="search-btn" onclick="onSearchSubmit()">찾기</button>
      <div id="searchResults" class="search-results"></div>
    </div>
    <div class="bm-filters" id="bmFilters"></div>
    <div class="view-modes" id="viewModes">
      <button class="tool-btn" id="tool-cadastral" onclick="toggleCadastral()">🗺️ 지적편집도</button>
      <button class="tool-btn hidden" id="tool-terr" onclick="toggleTerritoryView()">🧭 영업구역 보기</button>
      <button class="tool-btn hidden" id="tool-closed" onclick="toggleClosedView()">🚫 해지 센터 보기</button>
      <button class="tool-btn hidden" id="tool-planned" onclick="togglePlannedView()">🏗️ 개설예정지 보기</button>
      <button class="tool-btn" id="tool-unlock" onclick="unlockByPrompt()">🔑 편집 잠금해제</button>
      <button class="tool-btn hidden" id="tool-edit" onclick="toggleEditMode()">✏️ 영업구역 편집</button>
    </div>
  </header>
  <div id="mapWrap">
    <div id="map"></div>
    <div class="legend" id="legend" style="display:none"></div>
    <div class="tool-panel">
      <div id="measureResult" class="measure-result"></div>
      <div id="measureHint" class="measure-hint">Esc 키로 취소</div>
      <button class="tool-btn" id="tool-distance" onclick="selectMeasureTool('distance')">📏 거리재기</button>
      <button class="tool-btn" id="tool-area" onclick="selectMeasureTool('area')">📐 영업구역 그리기(다각형)</button>
      <button class="tool-btn" id="tool-radius" onclick="selectMeasureTool('radius')">⭕ 반경 그리기</button>
      <button class="tool-btn" id="tool-clear" onclick="clearMeasurements()">🗑️ 그린 것 지우기</button>
      <div class="terr-box" id="terrBox"></div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   설정 — 이 두 값만 채우면 바로 작동합니다
   ============================================================ */
const KAKAO_APP_KEY = 'c8c20c9263006ba1a272f260b050fb96'; // 카카오 개발자 콘솔 > 내 애플리케이션 > 앱 키 > JavaScript 키
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwNhaDXFVqrJ6i9LMhz9mqj9vlQYVtSl0eOrlpbV_qXYLyA4fshBWZrc0KJnZUyCPs/exec';

// 통합 캔버스에서 키를 받아도 되는 주소(이 주소에서 온 메시지만 믿는다)
const PARENT_ORIGINS = ['https://dashboard.ican1202.workers.dev'];
/* ============================================================ */

const BM_COLORS = {
  '숲':'#0891b2', 'IGSE':'#1e40af', '상가형':'#7c3aed', '학원':'#2f5d50',
  '교습소':'#c2410c', '공부방':'#b4762a', '우영':'#60a5fa'
};
const DEFAULT_COLOR = '#4b5563';
function bmColor(bm){
  for(const k in BM_COLORS){ if(bm && bm.includes(k)) return BM_COLORS[k]; }
  return DEFAULT_COLOR;
}
// 필터 칩·범례 노출 순서 고정(이 목록에 없는 BM은 뒤에 가나다순으로 붙는다)
const BM_ORDER = ['IGSE', '영어숲', '교습소', '공부방', '학원(상가형)'];
function bmSortCompare(a, b){
  const ia = BM_ORDER.indexOf(a), ib = BM_ORDER.indexOf(b);
  if(ia === -1 && ib === -1) return a.localeCompare(b);
  if(ia === -1) return 1;
  if(ib === -1) return -1;
  return ia - ib;
}
// 화면에 보여줄 이름만 바꾸고(싶은 부분), 실제 필터링·데이터 매칭은 원래 값(raw)을 그대로 쓴다.
const BM_DISPLAY_OVERRIDES = { '학원(상가형)': '우영(상가형)' };
function bmDisplayLabel(bm){
  return BM_DISPLAY_OVERRIDES[bm] || bm || '';
}

let map = null;
let userEmail = '';        // 대시보드가 알려 주는 담당자 접속 이메일(처리 기록용)
let closedShown = false;   // 해지 센터 보기(편집 키가 있을 때만 켤 수 있음)
function centerShown(c){ return c.st !== 'rem' || (closedShown && !!API_KEY); }
let allCenters = [];       // 서버에서 받은 원본 전체
let visibleCenters = [];   // BM 필터 적용된 목록
let _bmActive = null;      // null = 전체, 문자열 = 그 BM만
let _renderedOverlays = [];
let placesService = null;  // 카카오 장소 검색(주소/아파트/학교 등) 서비스 객체
let searchMarker = null;   // 검색해서 이동한 위치에 찍어주는 마커(검색할 때마다 이전 것은 지우고 새로 찍음)

function showStatus(msg, isError){
  let el = document.getElementById('statusBanner');
  if(!el){
    el = document.createElement('div');
    el.id = 'statusBanner';
    el.className = 'status-banner';
    document.getElementById('mapWrap').appendChild(el);
  }
  el.textContent = msg;
  el.className = 'status-banner' + (isError ? ' error' : '');
  el.style.display = msg ? '' : 'none';
}

/* ── 브라우저 위치정보로 초기 지도 중심 결정 ──
   허용하지 않거나 실패하면 null을 반환하고, 이 경우 대한민국 전체 화면으로 시작한다.
   6초 안에 응답이 없어도 포기하고 전체 화면으로 시작한다(무한 대기 방지).
*/
function getUserLocation(timeoutMs){
  return new Promise((resolve)=>{
    if(!navigator.geolocation){ resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
      () => resolve(null),
      { timeout: timeoutMs, maximumAge: 300000 }
    );
  });
}

/* ── 카카오 지도 SDK 로딩 ──
   services(장소검색), drawing(면적재기) 라이브러리를 함께 불러온다.
*/
function loadKakaoMapAndCreate(startLoc){
  return new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + encodeURIComponent(KAKAO_APP_KEY) + '&autoload=false&libraries=services,drawing';
    s.onerror = ()=>reject(new Error('카카오 지도 스크립트를 불러오지 못했습니다. 네트워크 상태를 확인해 주세요.'));
    s.onload = ()=>{
      if(!window.kakao || !window.kakao.maps){
        reject(new Error('카카오 지도 SDK 로드에 실패했습니다. 앱키(KAKAO_APP_KEY)를 확인해 주세요.'));
        return;
      }
      kakao.maps.load(function(){
        try{
          const center = startLoc
            ? new kakao.maps.LatLng(startLoc.lat, startLoc.lng)
            : new kakao.maps.LatLng(36.5, 127.8);
          const level = startLoc ? 4 : 13; // 4 = "동" 정도로 확대된 수준, 13 = 대한민국 전체가 보이는 수준
          const m = new kakao.maps.Map(document.getElementById('map'), { center, level });
          const zoomControl = new kakao.maps.ZoomControl();
          m.addControl(zoomControl, kakao.maps.ControlPosition.RIGHT);
          resolve(m);
        }catch(e){ reject(e); }
      });
    };
    document.head.appendChild(s);
  });
}

// <script> 태그로 응답을 불러온다(JSONP) — Apps Script 웹앱을 fetch()로 부를 때
// 가끔 발생하는 리다이렉트 우회 실패 문제를 원천적으로 피하기 위함. (변경 없음)
function fetchCentersViaScript(){
  return new Promise((resolve, reject)=>{
    const cbName = '__mapCb' + Date.now() + Math.floor(Math.random()*10000);
    let timeoutId;
    window[cbName] = function(data){
      clearTimeout(timeoutId);
      delete window[cbName];
      script.remove();
      if(!data.ok) return reject(new Error(data.error || '데이터를 불러오지 못했습니다.'));
      resolve(data.centers || []);
    };
    const script = document.createElement('script');
    script.src = APPS_SCRIPT_URL + '?action=getMapCenters&callback=' + cbName + '&_=' + Date.now();
    script.onerror = ()=>{
      clearTimeout(timeoutId);
      delete window[cbName];
      script.remove();
      reject(new Error('서버에 연결할 수 없습니다. 잠시 후 새로고침 해주세요.'));
    };
    timeoutId = setTimeout(()=>{
      delete window[cbName];
      script.remove();
      reject(new Error('서버 응답이 너무 오래 걸립니다. 잠시 후 새로고침 해주세요.'));
    }, 15000);
    document.head.appendChild(script);
  });
}
// [수정] 쿠키를 보내지 않는 fetch를 먼저 쓴다 → 회사 구글 계정(@yoons.com 등)이 로그인된 PC에서도 동작.
//        그래도 안 되면 기존 JSONP(<script>) 방식으로 다시 시도한다.
async function fetchJsonCookieless(url, timeoutMs){
  const ms = timeoutMs || 8000;
  const ctrl = (typeof AbortController!=='undefined') ? new AbortController() : null;
  const tid = setTimeout(()=>{ if(ctrl) ctrl.abort(); }, ms);
  try{
    const res = await fetch(url + (url.indexOf('?')>=0?'&':'?') + '_=' + Date.now(),
      { method:'GET', credentials:'omit', cache:'no-store', signal: ctrl ? ctrl.signal : undefined });
    const data = await res.json();
    if(!data || !data.ok) throw Object.assign(new Error((data && data.error) || '데이터를 불러오지 못했습니다.'), { server:true });
    return data;
  } finally { clearTimeout(tid); }
}
async function fetchCentersViaJsonp(){
  try{
    const d = await fetchJsonCookieless(APPS_SCRIPT_URL + '?action=getMapCenters');
    return d.centers || [];
  }catch(e){
    if(e && e.server) throw e;          // 서버가 보낸 오류는 그대로 표시
    return fetchCentersViaScript();     // 네트워크/형식 오류 → 기존 방식으로 재시도
  }
}
async function fetchCenters(){
  // 짧은 시간 안에 새로고침을 여러 번 하는 경우를 대비해, 최근 받아온 데이터를 5분간 브라우저에 캐싱해둔다.
  // 캐시가 있으면 구글 시트에 다시 요청하지 않고 바로 써서 로딩이 즉시 끝난다.
  const CACHE_KEY = 'yoonsmap_centers_cache_v1';
  const CACHE_TTL_MS = 5 * 60 * 1000; // 5분 — 필요하면 이 숫자만 바꾸면 됨
  try{
    const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    if(cached && Array.isArray(cached.centers) && (Date.now() - cached.ts) < CACHE_TTL_MS){
      return cached.centers;
    }
  }catch(e){ /* 캐시가 깨졌으면 무시하고 새로 받아온다 */ }

  let lastErr = null;
  for(let attempt=1; attempt<=2; attempt++){ // 첫 시도 실패해도 한 번 더 시도(일시적 네트워크 문제 대비)
    try{
      const centers = await fetchCentersViaJsonp();
      try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), centers })); }catch(e){}
      return centers;
    }catch(e){
      lastErr = e;
      if(attempt < 2) await new Promise(r=>setTimeout(r, 500));
    }
  }
  throw lastErr;
}

function buildBmFilters(){
  const bms = Array.from(new Set(allCenters.map(c=>c.bm).filter(Boolean))).sort(bmSortCompare);
  const wrap = document.getElementById('bmFilters');
  const opts = '<option value="">전체</option>' + bms.map(bm=>`<option value="${esc(bm)}" ${_bmActive===bm?'selected':''}>${esc(bmDisplayLabel(bm))}</option>`).join('');
  wrap.innerHTML = `<select class="bm-select" onchange="setBmFilter(this.value||null)" title="형태별 보기">${opts}</select>`;

  const legend = document.getElementById('legend');
  legend.innerHTML = bms.map(bm=>`<div><span class="dot" style="background:${bmColor(bm)}"></span>${bmDisplayLabel(bm)}</div>`).join('');
  legend.style.display = bms.length ? '' : 'none';
}
function setBmFilter(bm){
  _bmActive = bm;
  buildBmFilters();
  applyFilterAndRender();
}
function updateCountLabel(){
  const sus = allCenters.filter(c=>c.st==='sus').length;
  document.getElementById('countLabel').textContent = `${visibleCenters.length.toLocaleString()}개 센터 표시 중` + (sus ? ` · 해지 확인 대기 ${sus}곳(흐리게 표시)` : '');
}
function applyFilterAndRender(){
  visibleCenters = allCenters.filter(c=>centerShown(c) && (!_bmActive || c.bm===_bmActive));
  updateCountLabel();
  renderMarkers();
}

/* ── 검색 결과 위치에 마커 찍기 ── (검색할 때마다 이전 마커는 지우고 새로 찍는다) */
function placeSearchMarker(lat, lng){
  if(searchMarker) searchMarker.setMap(null);
  searchMarker = new kakao.maps.Marker({
    position: new kakao.maps.LatLng(lat, lng),
    map: map,
    zIndex: 20
  });
}

/* ── 검색 ──
   1) 입력할 때마다: 우리 센터 목록(무료, 즉시)만 빠르게 보여준다.
   2) "찾기"를 누르거나 Enter를 치면: 카카오 장소 검색(주소/아파트/학교 등)을 추가로 불러와 아래에 덧붙인다.
      (모든 키 입력마다 카카오 장소 검색을 부르면 무료 쿼터를 빨리 소진하므로, 검색을 확정한 시점에만 호출한다)
*/
function onSearchInput(v){
  const box = document.getElementById('searchResults');
  box._placeMatches = null; // 입력이 바뀌면 이전 "주변 장소" 결과는 무효화
  const q = v.trim().toLowerCase();
  if(!q){ box.style.display='none'; box.innerHTML=''; return; }
  const matches = allCenters.filter(c=>centerShown(c) && ((c.address||'').toLowerCase().includes(q) || (c.name||'').toLowerCase().includes(q))).slice(0,15);
  if(!matches.length){
    box.innerHTML = '<div class="search-item" style="color:var(--muted)">일치하는 센터가 없습니다. (Enter를 누르면 주변 장소도 찾아봅니다)</div>';
    box.style.display = 'block';
    box._matches = [];
    return;
  }
  box.innerHTML = matches.map((c,i)=>`<div class="search-item" onclick="jumpTo(${i})"><b>${c.name}</b><span>${c.address||''}</span></div>`).join('');
  box._matches = matches;
  box.style.display = 'block';
}
function onSearchSubmit(){
  const v = document.getElementById('searchInput').value.trim();
  if(!v) return;
  onSearchInput(v);
  const box = document.getElementById('searchResults');
  if(box._matches && box._matches.length === 1){
    jumpTo(0); // 우리 센터가 정확히 1건이면 바로 이동(기존 동작 유지)
    return;
  }
  searchPlacesAndAppend(v);
}
function jumpTo(i){
  const box = document.getElementById('searchResults');
  const c = box._matches[i];
  box.style.display='none';
  document.getElementById('searchInput').value='';
  // setLevel과 panTo를 따로 부르면 두 애니메이션이 서로 충돌해서 "제자리에서 확대만" 되는 문제가 있었다.
  // map.jump()는 중심좌표와 레벨을 한 번에 이동시켜서 이 문제를 원천적으로 피한다.
  map.jump(new kakao.maps.LatLng(c.lat, c.lng), 3, {animate:true});
  placeSearchMarker(c.lat, c.lng);
}

function ensurePlacesService(){
  if(!placesService) placesService = new kakao.maps.services.Places();
  return placesService;
}
// 카카오 키워드 장소 검색 — 도로명 주소, 아파트, 학교, 건물명 등 일반 장소를 찾아 기존 검색 결과 아래에 덧붙인다.
function searchPlacesAndAppend(keyword){
  const box = document.getElementById('searchResults');
  ensurePlacesService().keywordSearch(keyword, function(result, status){
    if(status !== kakao.maps.services.Status.OK) return; // 결과 없음/오류 시 조용히 무시(센터 검색 결과는 이미 떠 있음)
    const top = result.slice(0, 8);
    box._placeMatches = top;
    const placesHtml = top.map((p,i)=>
      `<div class="search-item" onclick="jumpToPlace(${i})"><b>📍 ${p.place_name}</b><span>${p.road_address_name || p.address_name || ''}</span></div>`
    ).join('');
    if(placesHtml){
      if(!box._matches || !box._matches.length){ box.innerHTML = ''; }
      box.innerHTML += `<div class="search-divider">주변 장소(주소·아파트·학교 등)</div>` + placesHtml;
      box.style.display = 'block';
    }
  });
}
function jumpToPlace(i){
  const box = document.getElementById('searchResults');
  const p = box._placeMatches[i];
  box.style.display = 'none';
  document.getElementById('searchInput').value = '';
  const lat = parseFloat(p.y), lng = parseFloat(p.x);
  map.jump(new kakao.maps.LatLng(lat, lng), 3, {animate:true});
  placeSearchMarker(lat, lng);
}

/* ── 마커 렌더링(그리드 기반 클러스터링) ── */
function clearOverlays(){
  _renderedOverlays.forEach(o=>o.setMap(null));
  _renderedOverlays = [];
}
function makeMarkerOverlay(center){
  const pos = new kakao.maps.LatLng(center.lat, center.lng);
  const color = bmColor(center.bm);
  const el = document.createElement('div');
  el.className = 'marker-box' + (center.st ? ' ' + center.st : '');
  el.style.borderColor = color;
  const stTag = center.st === 'sus' ? '<span class="marker-tag" title="'+esc(center.why||'')+'">해지?</span>' : center.st === 'rem' ? '<span class="marker-tag">해지</span>' : '';
  el.innerHTML = `<div class="marker-bm" style="color:${color}">${bmDisplayLabel(center.bm)}</div><div class="marker-name">${center.name}${center.adj?' <span title="위치 보정됨">📌</span>':''}${stTag}</div>`;
  el.addEventListener('click', ()=>{ if(editMode) selectCenterForEdit(center); });
  el.addEventListener('contextmenu', ev=>{ ev.preventDefault(); ev.stopPropagation(); if(currentTool || terrDrawing || _plannedMove) return; openCenterMenu(center, el); });
  if(editMode) el.style.cursor='pointer';
  const overlay = new kakao.maps.CustomOverlay({
    position: pos,
    content: el,
    xAnchor: 0, yAnchor: 0,
    zIndex: 10
  });
  overlay.setMap(map);
  return overlay;
}
function makeClusterOverlay(lat, lng, count){
  const el = document.createElement('div');
  el.className = 'cluster-box';
  el.textContent = count;
  el.addEventListener('click', ()=>{
    map.jump(new kakao.maps.LatLng(lat, lng), Math.max(map.getLevel()-3, 1), {animate:true});
  });
  const overlay = new kakao.maps.CustomOverlay({
    position: new kakao.maps.LatLng(lat, lng),
    content: el,
    xAnchor: 0, yAnchor: 0,
    zIndex: 5
  });
  overlay.setMap(map);
  return overlay;
}
function renderMarkers(){
  if(!map) return;
  clearOverlays();
  if(!visibleCenters.length) return;
  // 화면에 실제로 보이는 범위(bounds) 안의 센터만 추려서 그린다.
  // 예전에는 929개 전체를 매번 다시 그려서 패닝·줌마다 버벅였는데,
  // 화면 밖 센터는 그릴 필요가 없으므로 이렇게 걸러내면 훨씬 가벼워진다.
  const bounds = map.getBounds();
  const onScreen = visibleCenters.filter(c => bounds.contain(new kakao.maps.LatLng(c.lat, c.lng)));
  renderWithClustering(onScreen);
}
function renderWithClustering(centers){
  const level = map.getLevel();
  if(level <= 8){
    centers.forEach(c=>{ _renderedOverlays.push(makeMarkerOverlay(c)); });
    return;
  }
  const approxZoom = 21 - level;
  const cellSizeDeg = 84.375 / Math.pow(2, approxZoom);
  const buckets = {};
  centers.forEach(c=>{
    const key = Math.floor(c.lat/cellSizeDeg) + '_' + Math.floor(c.lng/cellSizeDeg);
    if(!buckets[key]) buckets[key] = [];
    buckets[key].push(c);
  });
  Object.values(buckets).forEach(group=>{
    if(group.length === 1){
      _renderedOverlays.push(makeMarkerOverlay(group[0]));
    } else {
      const avgLat = group.reduce((s,c)=>s+c.lat,0)/group.length;
      const avgLng = group.reduce((s,c)=>s+c.lng,0)/group.length;
      _renderedOverlays.push(makeClusterOverlay(avgLat, avgLng, group.length));
    }
  });
}

/* ── 거리·면적·반경 재기 ──
   - 거리재기: A, B 두 번 클릭하면 바로 끝나고 거리 표시 (직접 구현)
   - 반경재기: 중심 클릭 → 반지름 지점 클릭, 두 번 클릭하면 바로 끝나고 반경 표시 (직접 구현)
   - 면적재기: 여러 점을 찍어 다각형을 그려야 하므로(2번 클릭으로 끝낼 수 없음) 카카오 기본 Drawing 라이브러리 사용
   - 셋 다 그리는 중 Esc 키를 누르면 취소된다.
*/
let drawingManager = null;      // 면적재기(다각형) 전용
let currentTool = null;         // 'distance' | 'area' | 'radius' | null
let _customCleanup = null;      // 거리재기/반경재기 중 Esc·전환 시 정리할 함수
let _customOverlays = [];       // 거리재기/반경재기로 그려진 최종 도형들(지우기 버튼 대상)
let cadastralOn = false;

function formatDistance(m){
  return m < 1000 ? Math.round(m) + 'm' : (m/1000).toFixed(2) + 'km';
}
function formatArea(m2){
  return m2 < 10000 ? Math.round(m2).toLocaleString() + '㎡' : (m2/10000).toFixed(2) + 'ha';
}
// 두 좌표 사이의 실제 거리(m)를 하버사인 공식으로 계산 (지도 라이브러리 도움 없이 즉시 계산)
function distanceMeters(a, b){
  const R = 6371008.8;
  const toRad = d => d * Math.PI/180;
  const lat1 = toRad(a.getLat()), lat2 = toRad(b.getLat());
  const dLat = toRad(b.getLat()-a.getLat());
  const dLng = toRad(b.getLng()-a.getLng());
  const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

// 완성된 거리/반경 결과 1세트(도형+라벨). 라벨의 × 를 누르면 이 세트만 지운다.
function addMeasureResult(shape, text, pos){
  const el = document.createElement('div');
  el.className = 'measure-label';
  el.innerHTML = '<span></span><span class="m-x" title="이 항목만 삭제">×</span>';
  el.firstChild.textContent = text;
  const ov = new kakao.maps.CustomOverlay({ position:pos, content:el, xAnchor:0, yAnchor:1, zIndex:25, clickable:true });
  ov.setMap(map);
  el.querySelector('.m-x').addEventListener('click', function(ev){
    ev.stopPropagation();
    shape.setMap(null); ov.setMap(null);
    _customOverlays = _customOverlays.filter(o=>o!==shape && o!==ov);
  });
  _customOverlays.push(shape, ov);
}
function showMeasureText(text){
  const box = document.getElementById('measureResult');
  box.textContent = text;
  box.style.display = 'block';
}
function showMeasureHint(show){
  document.getElementById('measureHint').style.display = show ? 'block' : 'none';
}
function setActiveToolButton(mode){
  ['distance','area','radius'].forEach(id=>document.getElementById('tool-'+id).classList.remove('active'));
  if(mode) document.getElementById('tool-'+mode).classList.add('active');
}

// 진행 중이던 거리재기/반경재기를 정리(임시 도형 제거, 이벤트 리스너 해제)
function cleanupCustomTool(){
  if(_customCleanup){ _customCleanup(); _customCleanup = null; }
  showMeasureHint(false);
}

function startDistanceMeasure(){
  cleanupCustomTool();
  showMeasureHint(true);
  let p1 = null;
  let moveLine = null;
  let labelEl = null, labelOverlay = null;

  function onClick(e){
    if(!p1){
      p1 = e.latLng;
      moveLine = new kakao.maps.Polyline({
        map: map, path: [p1, p1],
        strokeColor:'#e11d48', strokeWeight:3, strokeOpacity:0.85, strokeStyle:'shortdash'
      });
      labelEl = document.createElement('div');
      labelEl.className = 'measure-label';
      labelEl.textContent = '0m';
      labelOverlay = new kakao.maps.CustomOverlay({ position:p1, content:labelEl, xAnchor:0, yAnchor:1, zIndex:30 });
      labelOverlay.setMap(map);
      kakao.maps.event.addListener(map, 'mousemove', onMove);
    } else {
      finish(e.latLng);
    }
  }
  function onMove(e){
    if(moveLine) moveLine.setPath([p1, e.latLng]);
    labelEl.textContent = formatDistance(distanceMeters(p1, e.latLng));
    labelOverlay.setPosition(e.latLng); // 라벨이 마우스 포인터를 따라다닌다
  }
  function finish(p2){
    kakao.maps.event.removeListener(map, 'click', onClick);
    kakao.maps.event.removeListener(map, 'mousemove', onMove);
    if(moveLine) moveLine.setMap(null);
    labelOverlay.setMap(null); // 따라다니던 라벨은 지우고
    const finalLine = new kakao.maps.Polyline({
      map: map, path: [p1, p2],
      strokeColor:'#e11d48', strokeWeight:3
    });
    const dist = finalLine.getLength();
    addMeasureResult(finalLine, '거리: ' + formatDistance(dist), p2); // 마감한 지점(B)에 최종 거리 라벨(×로 개별 삭제)
    showMeasureText('거리: ' + formatDistance(dist));
    showMeasureHint(false);
    currentTool = null;
    setActiveToolButton(null);
  }
  kakao.maps.event.addListener(map, 'click', onClick);
  _customCleanup = function(){
    kakao.maps.event.removeListener(map, 'click', onClick);
    kakao.maps.event.removeListener(map, 'mousemove', onMove);
    if(moveLine) moveLine.setMap(null);
    if(labelOverlay) labelOverlay.setMap(null);
  };
}

function startRadiusMeasure(){
  cleanupCustomTool();
  showMeasureHint(true);
  let center = null;
  let moveCircle = null;
  let labelEl = null, labelOverlay = null;

  function onClick(e){
    if(!center){
      center = e.latLng;
      moveCircle = new kakao.maps.Circle({
        map: map, center: center, radius: 1,
        strokeColor:'#e11d48', strokeWeight:3, strokeOpacity:0.85,
        fillColor:'#e11d48', fillOpacity:0.2
      });
      labelEl = document.createElement('div');
      labelEl.className = 'measure-label';
      labelEl.textContent = '0m';
      labelOverlay = new kakao.maps.CustomOverlay({ position:center, content:labelEl, xAnchor:0, yAnchor:1, zIndex:30 });
      labelOverlay.setMap(map);
      kakao.maps.event.addListener(map, 'mousemove', onMove);
    } else {
      finish(e.latLng);
    }
  }
  function onMove(e){
    const r = distanceMeters(center, e.latLng);
    if(moveCircle) moveCircle.setRadius(r);
    labelEl.textContent = formatDistance(r);
    labelOverlay.setPosition(e.latLng); // 라벨이 마우스 포인터를 따라다닌다
  }
  function finish(edge){
    kakao.maps.event.removeListener(map, 'click', onClick);
    kakao.maps.event.removeListener(map, 'mousemove', onMove);
    const r = distanceMeters(center, edge);
    moveCircle.setRadius(r);
    labelOverlay.setMap(null); // 따라다니던 라벨은 지우고
    addMeasureResult(moveCircle, '반경: ' + formatDistance(r), edge); // 반지름 끝에 최종 반경 라벨(×로 개별 삭제)
    showMeasureText('반경: ' + formatDistance(r));
    showMeasureHint(false);
    currentTool = null;
    setActiveToolButton(null);
  }
  kakao.maps.event.addListener(map, 'click', onClick);
  _customCleanup = function(){
    kakao.maps.event.removeListener(map, 'click', onClick);
    kakao.maps.event.removeListener(map, 'mousemove', onMove);
    if(moveCircle) moveCircle.setMap(null);
    if(labelOverlay) labelOverlay.setMap(null);
  };
}

function initDrawingManager(){
  drawingManager = new kakao.maps.drawing.DrawingManager({
    map: map,
    drawingMode: [ kakao.maps.drawing.OverlayType.POLYGON ],
    guideTooltip: ['draw','drag','edit'],
    polygonOptions: { draggable:true, removable:true, editable:true, strokeColor:'#e11d48', fillColor:'#e11d48', fillOpacity:0.25 }
  });
  kakao.maps.event.addListener(drawingManager, 'drawend', function(data){
    if(terrDrawing === 'polygon'){ onTerrPolygonDrawn(data.target); return; }
    showMeasureText('면적: ' + formatArea(data.target.getArea()));
    currentTool = null;
    setActiveToolButton(null);
  });
}

function selectMeasureTool(mode){
  cleanupCustomTool();
  if(drawingManager) drawingManager.cancel();

  if(currentTool === mode){
    currentTool = null;
    setActiveToolButton(null);
    return; // 같은 버튼을 다시 누르면 끄기
  }
  currentTool = mode;
  setActiveToolButton(mode);
  document.getElementById('measureResult').style.display = 'none';

  if(mode === 'distance'){
    startDistanceMeasure();
  } else if(mode === 'radius'){
    startRadiusMeasure();
  } else if(mode === 'area'){
    if(!drawingManager) initDrawingManager();
    showMeasureHint(true);
    drawingManager.select(kakao.maps.drawing.OverlayType.POLYGON);
  }
}

function clearMeasurements(){
  cleanupCustomTool();
  _customOverlays.forEach(o=>o.setMap(null));
  _customOverlays = [];
  if(drawingManager){
    drawingManager.cancel();
    const data = drawingManager.getOverlays();
    Object.keys(data).forEach(type=>{
      data[type].forEach(overlay => drawingManager.remove(overlay));
    });
  }
  document.getElementById('measureResult').style.display = 'none';
  currentTool = null;
  setActiveToolButton(null);
}

// Esc 키로 진행 중인 거리재기/면적재기/반경재기를 취소한다
document.addEventListener('keydown', function(e){
  if(e.key !== 'Escape') return;
  closeCtx(); cancelPlannedMove();
  cleanupCustomTool();
  if(drawingManager) drawingManager.cancel();
  currentTool = null;
  setActiveToolButton(null);
});

/* ── 지적편집도 보기 켜기/끄기 ── */
function toggleCadastral(){
  cadastralOn = !cadastralOn;
  if(cadastralOn){
    map.addOverlayMapTypeId(kakao.maps.MapTypeId.USE_DISTRICT);
  } else {
    map.removeOverlayMapTypeId(kakao.maps.MapTypeId.USE_DISTRICT);
  }
  document.getElementById('tool-cadastral').classList.toggle('active', cadastralOn);
}


/* ============================================================
   영업구역 저장·표시·편집
   - 키(API_KEY)가 있어야만 읽기/쓰기 가능 → 키 없는 일반 지도에는 영업구역이 보이지 않는다
   - 키 받는 방법  C) 통합 캔버스가 postMessage로 자동 전달   A) 🔑 버튼으로 직접 입력
   - 센터 1개당 도형 1개(다각형 또는 반경원). 수정은 "다시 그리기 → 저장"(같은 센터는 덮어쓰기)
   ============================================================ */
let API_KEY = '';
let territories = {};          // code -> {code,name,type,geo}
let terrShown = false;         // 영업구역 보기 켜짐
let editMode = false;
let selCenter = null;          // 편집 중 선택된 센터
let terrDrawing = null;        // 'polygon' | 'circle' | null
let draft = null;              // {type, shape(kakao 객체)}
let terrOverlays = {};         // code -> kakao 도형 (화면에 그려진 것)
const TERR_MAX_LEVEL = 7;      // 이 레벨보다 멀리 축소하면 영업구역은 숨긴다(성능)

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ── 서버 호출 ── */
function jsonpCallScript(params){
  return new Promise((resolve, reject)=>{
    const cb = '__tcb' + Date.now() + Math.floor(Math.random()*10000);
    const sc = document.createElement('script');
    const t = setTimeout(()=>{ delete window[cb]; sc.remove(); reject(new Error('서버 응답 지연')); }, 15000);
    window[cb] = function(d){ clearTimeout(t); delete window[cb]; sc.remove(); d && d.ok ? resolve(d) : reject(new Error((d&&d.error)||'요청 실패')); };
    sc.onerror = ()=>{ clearTimeout(t); delete window[cb]; sc.remove(); reject(new Error('서버에 연결할 수 없습니다')); };
    const q = Object.keys(params).map(k=>k+'='+encodeURIComponent(params[k])).join('&');
    sc.src = APPS_SCRIPT_URL + '?' + q + '&callback=' + cb + '&_=' + Date.now();
    document.head.appendChild(sc);
  });
}
async function jsonpCall(params){
  const q = Object.keys(params).map(k=>k+'='+encodeURIComponent(params[k])).join('&');
  try{
    return await fetchJsonCookieless(APPS_SCRIPT_URL + '?' + q);
  }catch(e){
    if(e && e.server) throw e;
    return jsonpCallScript(params);
  }
}
async function postCall(payload){
  const ctl = new AbortController();
  const timer = setTimeout(()=>ctl.abort(), 30000);
  let res, txt;
  try{
    res = await fetch(APPS_SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(Object.assign({apiKey: API_KEY}, payload)), signal: ctl.signal });
    txt = await res.text();
  }catch(e){
    throw new Error(e && e.name === 'AbortError' ? '서버 응답이 30초 넘게 없습니다' : '서버에 연결할 수 없습니다 (' + (e && e.message || e) + ')');
  }finally{ clearTimeout(timer); }
  let d;
  try{ d = JSON.parse(txt); }
  catch(e){ throw new Error('서버가 올바르지 않은 응답을 보냈습니다 (Apps Script 배포 상태 확인 필요): ' + String(txt).replace(/<[^>]*>/g,' ').trim().slice(0,120)); }
  if(!d.ok) throw new Error(d.error || '저장 실패');
  return d;
}

function terrColorOf(code){
  const c = allCenters.find(x=>x.code===code);
  return c ? bmColor(c.bm) : DEFAULT_COLOR;
}
function makeShape(t, highlight){
  const color = terrColorOf(t.code);
  const opt = { strokeColor:color, strokeWeight: highlight?4:2, strokeOpacity:0.9, fillColor:color, fillOpacity: highlight?0.3:0.15, zIndex:1 };
  if(t.type === 'circle'){
    return new kakao.maps.Circle(Object.assign({center:new kakao.maps.LatLng(t.geo.lat,t.geo.lng), radius:t.geo.r}, opt));
  }
  return new kakao.maps.Polygon(Object.assign({path:t.geo.path.map(p=>new kakao.maps.LatLng(p[0],p[1]))}, opt));
}
function terrInBounds(t, b){
  if(t.type === 'circle') return b.contain(new kakao.maps.LatLng(t.geo.lat, t.geo.lng));
  return t.geo.path.some(p=>b.contain(new kakao.maps.LatLng(p[0],p[1])));
}
function renderTerritories(){
  if(!map) return;
  const hide = !terrShown || !API_KEY || map.getLevel() > TERR_MAX_LEVEL;
  const want = {};
  if(!hide){
    const b = map.getBounds();
    Object.keys(territories).forEach(code=>{
      if(draft && selCenter && selCenter.code === code) return;   // 편집 중인 센터의 옛 도형은 숨김(초안이 대신 보임)
      const t = territories[code];
      if(terrInBounds(t, b)) want[code] = true;
    });
  }
  Object.keys(terrOverlays).forEach(code=>{                       // 화면에서 사라진 것만 제거
    if(!want[code]){ terrOverlays[code].setMap(null); delete terrOverlays[code]; }
  });
  Object.keys(want).forEach(code=>{                                // 새로 필요한 것만 추가
    if(terrOverlays[code]) return;
    const sh = makeShape(territories[code], selCenter && selCenter.code === code);
    sh.setMap(map); terrOverlays[code] = sh;
  });
  const tb = document.getElementById('tool-terr');
  if(terrShown && map.getLevel() > TERR_MAX_LEVEL) tb.textContent = '🧭 영업구역 (더 확대하면 보임)';
  else tb.textContent = '🧭 영업구역 보기';
}
function resetTerrOverlays(){

function startTerrCircle(freeCenter, keepR){
  cancelDraft(); resetTerrOverlays();
  terrDrawing = 'circle'; showMeasureHint(true);
  const opt = { map:map, radius:keepR||1, strokeColor:'#e11d48', strokeWeight:3, fillColor:'#e11d48', fillOpacity:0.2 };
  if(freeCenter){
    // 중심을 센터가 아닌 곳에 두는 경우: ① 중심 클릭 → ② 반경 클릭
    setDraftInfo('<div style="margin-top:6px">① 원의 <b>중심</b>이 될 곳을 클릭하세요</div>', false);
    let circ = null, center = null;
    function onMove(e){ if(circ) circ.setRadius(distanceMeters(center, e.latLng)); }
    function onClick(e){
      if(!center){
        center = e.latLng;
        circ = new kakao.maps.Circle(Object.assign({}, opt, {center:center}));
        if(keepR){ finish(keepR); return; }
        setDraftInfo('<div style="margin-top:6px">② 마우스로 반경을 정하고 클릭</div>', false);
        kakao.maps.event.addListener(map,'mousemove',onMove);
      } else finish(Math.max(10, Math.round(distanceMeters(center, e.latLng))));
    }
    function finish(r){
      kakao.maps.event.removeListener(map,'mousemove',onMove); kakao.maps.event.removeListener(map,'click',onClick);
      _customCleanup = null; terrDrawing = null; showMeasureHint(false);
      circ.setRadius(r); draft = {type:'circle', shape:circ, center:center}; circleInfo();
    }
    kakao.maps.event.addListener(map,'click',onClick);
    _customCleanup = function(){ kakao.maps.event.removeListener(map,'mousemove',onMove); kakao.maps.event.removeListener(map,'click',onClick); if(circ) circ.setMap(null); };
    return;
  }
  const center = new kakao.maps.LatLng(selCenter.lat, selCenter.lng);   // 센터 위치가 중심
  const circ = new kakao.maps.Circle(Object.assign({}, opt, {center:center}));
  setDraftInfo('<div style="margin-top:6px">마우스를 움직여 반경을 정하고 클릭 (또는 숫자 직접 입력)</div>', false);
  function onMove(e){ circ.setRadius(distanceMeters(center, e.latLng)); }
  function onClick(e){
    kakao.maps.event.removeListener(map,'mousemove',onMove); kakao.maps.event.removeListener(map,'click',onClick);
    _customCleanup = null; terrDrawing = null; showMeasureHint(false);
    circ.setRadius(Math.max(10, Math.round(distanceMeters(center, e.latLng))));
    draft = {type:'circle', shape:circ, center:center}; circleInfo();
  }
  kakao.maps.event.addListener(map,'mousemove',onMove); kakao.maps.event.addListener(map,'click',onClick);
  _customCleanup = function(){ kakao.maps.event.removeListener(map,'mousemove',onMove); kakao.maps.event.removeListener(map,'click',onClick); circ.setMap(null); };
}

  const r = Math.round(draft.shape.getRadius());
  setDraftInfo('<div style="margin-top:6px">반경 <input type="number" id="terrR" value="'+r+'" min="10" step="10"> m '+

    '<div class="row"><button class="tool-btn" onclick="startTerrCircle(true, Math.round(draft.shape.getRadius()))">📍 중심만 다시 찍기</button></div></div>', true);

function terrMsg(text, color){
  const i = document.getElementById('terrDraftInfo');
  if(i) i.innerHTML = '<div style="margin-top:6px;color:'+(color||'#b91c1c')+';font-weight:600;word-break:keep-all">'+esc(text)+'</div>';
  console.log('[영업구역]', text);
}
async function saveDraft(){
  if(!selCenter){ terrMsg('센터가 선택되지 않았습니다. 센터 마커를 다시 클릭하세요.'); return; }
  if(!draft){ terrMsg('저장할 도형이 없습니다. 📐 다각형(또는 반경원)으로 다시 그려 주세요.'); return; }
  const btn = document.getElementById('terrSaveBtn');
  let geo, type = draft.type;
  try{
    if(type === 'circle'){ geo = {lat:Number(draft.center.getLat().toFixed(6)), lng:Number(draft.center.getLng().toFixed(6)), r:Math.round(draft.shape.getRadius())}; }
    else {
      // 그리기 도구가 만든 꼭짓점은 위도/경도가 아니라 카카오 내부 좌표(WCONGNAMUL, 수십만 단위 숫자)로 들어온다 → 카카오 변환 함수로 위도/경도로 바꾼다
      const raw = draft.shape.getPath();
      console.log('[영업구역] 꼭짓점 원본 샘플', raw && raw[0], '개수', raw && raw.length);
      const toLL = (p) => {
        if(p && typeof p.getLat === 'function') return [p.getLat(), p.getLng()];          // 일반 LatLng
        const nums = Object.keys(p||{}).map(k=>p[k]).filter(v=>typeof v === 'number' && isFinite(v));
        if(nums.length < 2) return [NaN, NaN];
        const a = nums[0], b = nums[1];                                                   // 순서: x(가로), y(세로)
        if(Math.abs(a) > 1000 || Math.abs(b) > 1000){                                     // 내부 좌표 → 위경도
          const ll = new kakao.maps.Coords(a, b).toLatLng();
          return [ll.getLat(), ll.getLng()];
        }
        return (a > 100) ? [b, a] : [a, b];                                               // 이미 위경도인 경우(경도가 100 넘으면 x=경도)
      };
      const path = raw.map(p=>{ const r = toLL(p); return [Number(r[0].toFixed(6)), Number(r[1].toFixed(6))]; });
      geo = {path: path};
      console.log('[영업구역] 저장할 값(처음 2점)', path.slice(0,2), '총', path.length);
    }
  }catch(e){ console.error(e); terrMsg('도형 좌표를 읽지 못했습니다: ' + e.message + ' — 다시 그려 주세요.'); return; }
  if(btn){ btn.disabled = true; btn.textContent = '저장 중…'; }
  terrMsg('저장 중입니다…', '#334155');
  try{
    await postCall({action:'saveTerritory', code:selCenter.code, name:selCenter.name, type:type, geo:geo});
    territories[selCenter.code] = {code:selCenter.code, name:selCenter.name, type:type, geo:geo};
    cancelDraft(); renderTerrBox(); resetTerrOverlays();
    terrMsg('✅ 저장되었습니다', '#166534');
  }catch(e){
    console.error(e);
    terrMsg('저장 실패: ' + e.message + (geo && geo.path ? ' (첫 점: ' + JSON.stringify(geo.path[0]) + ', ' + geo.path.length + '개)' : ''));
    if(btn){ btn.disabled = false; btn.textContent = '💾 저장'; }
  }
}
async function deleteTerritory(){
  if(!selCenter || !confirm(selCenter.name + ' 영업구역을 삭제할까요?')) return;
  try{
    await postCall({action:'deleteTerritory', code:selCenter.code});
    delete territories[selCenter.code];
    cancelDraft(); renderTerrBox(); resetTerrOverlays();
  }catch(e){ console.error(e); terrMsg('삭제 실패: ' + e.message); }

function lookupAddress(latLng){
  return new Promise(resolve=>{
    try{
      if(!geocoder) geocoder = new kakao.maps.services.Geocoder();
      geocoder.coord2Address(latLng.getLng(), latLng.getLat(), function(res, status){
        if(status !== kakao.maps.services.Status.OK || !res.length){ resolve(null); return; }
        const r = res[0];
        resolve({ road: r.road_address ? r.road_address.address_name : '', jibun: r.address ? r.address.address_name : '' });
      });
    }catch(e){ resolve(null); }
  });
}
function copyText(t){
  try{ if(navigator.clipboard && navigator.clipboard.writeText){ return navigator.clipboard.writeText(t); } }catch(e){}
  const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){} ta.remove();
  return Promise.resolve();
}
function addrText(a){ return a ? (a.road || a.jibun) : ''; }

    openCtxBox(point, '<div class="ctx-body">개설 예정지 저장은 <b>편집 잠금해제</b> 후 가능합니다.<br>(통합 캔버스 안에서는 자동 해제)<div class="row" style="margin-top:6px"><button class="tool-btn" id="ctxClose">닫기</button></div></div>');
    document.getElementById('ctxClose').onclick = closeCtx; return;
  }
  const opts = PLANNED_FORM_OPTS.map(o=>'<option value="'+esc(o[1])+'">'+esc(o[0])+'</option>').join('');
  openCtxBox(point, '<div class="ctx-body"><b>🏗️ 개설 예정지 등록</b><br>'+
    '<span id="plAddr" style="color:#6b7280;font-size:11.5px">주소 확인 중…</span><br>'+
    '센터명<input id="plName" maxlength="40" placeholder="예) (H)OO센터"> 형태<select id="plForm">'+opts+'</select>'+
    '<div class="row"><button class="tool-btn" id="plSave">💾 저장</button><button class="tool-btn" id="ctxClose">취소</button></div></div>');
  let addr = '';
  lookupAddress(latLng).then(a=>{ addr = addrText(a); const el = document.getElementById('plAddr'); if(el) el.textContent = addr || '주소 없음'; });
  document.getElementById('ctxClose').onclick = closeCtx;
  document.getElementById('plName').focus();
  document.getElementById('plSave').onclick = async function(){
    const name = document.getElementById('plName').value.trim();
    if(!name){ document.getElementById('plName').focus(); return; }
    const btn = this; btn.disabled = true; btn.textContent = '저장 중…';
    const item = { id:'P'+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36), name:name,
                   form:document.getElementById('plForm').value, lat:Number(latLng.getLat().toFixed(6)), lng:Number(latLng.getLng().toFixed(6)), addr:addr };
    try{
      await postCall(Object.assign({action:'savePlanned'}, item));
      planned[item.id] = item; plannedShown = true; syncPlannedBtn(); renderPlanned(); closeCtx();
    }catch(e){ alert('저장 실패: ' + e.message); btn.disabled = false; btn.textContent = '💾 저장'; }
  };
}

/* ── 개설 예정지 표시 ── */
function renderPlanned(){
  if(!map) return;
  Object.keys(plannedOverlays).forEach(id=>{ plannedOverlays[id].setMap(null); });
  plannedOverlays = {};
  if(!plannedShown || !API_KEY) return;
  Object.keys(planned).forEach(id=>{
    const p = planned[id];
    const el = document.createElement('div');
    el.className = 'planned-box';
    el.innerHTML = '<div class="marker-bm">예정 · '+esc(bmDisplayLabel(p.form))+'</div><div class="marker-name">'+esc(p.name)+'</div>';
    el.addEventListener('click', function(ev){ ev.stopPropagation(); openPlannedMenu(p, el); });
    el.addEventListener('contextmenu', function(ev){ ev.preventDefault(); ev.stopPropagation(); openPlannedMenu(p, el); });
    const ov = new kakao.maps.CustomOverlay({ position:new kakao.maps.LatLng(p.lat,p.lng), content:el, xAnchor:0, yAnchor:0, zIndex:12, clickable:true });
    ov.setMap(map); plannedOverlays[id] = ov;
  });
}
function syncPlannedBtn(){
  const b = document.getElementById('tool-planned'); if(!b) return;
  b.classList.toggle('hidden', !API_KEY);
  b.classList.toggle('active', plannedShown);
}
function togglePlannedView(){ plannedShown = !plannedShown; syncPlannedBtn(); renderPlanned(); }

/* ── 기존 센터 위치 보정 (서버 시트 center_pos, 모두에게 반영) ── */
function openCenterMenu(c, el){
  const wrap = document.getElementById('mapWrap');
  const r = el.getBoundingClientRect(), w = wrap.getBoundingClientRect();
  const pt = {x:r.left - w.left, y:r.bottom - w.top + 4};
  const head = '<div class="ctx-body"><b>'+esc(c.name)+'</b> ('+esc(bmDisplayLabel(c.bm))+')'+(c.address?'<br><span style="color:#6b7280;font-size:11.5px">'+esc(c.address)+'</span>':'')+
    (c.adj?'<br><span style="color:#92400e;font-size:11.5px">📌 위치 보정됨(원본과 '+formatDistance(distanceMeters(new kakao.maps.LatLng(c.lat,c.lng), new kakao.maps.LatLng(c.olat,c.olng)))+' 차이)</span>':'')+'</div>';
  if(!API_KEY){
    openCtxBox(pt, head+'<div class="ctx-body" style="padding-top:0">위치 보정은 <b>편집 잠금해제</b> 후 가능합니다.</div><div class="ctx-item" id="ctxClose">닫기</div>');
    document.getElementById('ctxClose').onclick = closeCtx; return;
  }
  const stItems = c.st === 'sus'
    ? '<div class="ctx-body" style="padding-top:0;color:#92400e">⚠ 해지 의심 ('+esc(c.why||'')+')</div><div class="ctx-item danger" id="stRemove">🚫 해지 확인 → 지도에서 제거</div><div class="ctx-item" id="stKeep">✅ 해지 아님 → 정상 표시</div>'
    : c.st === 'rem' ? '<div class="ctx-body" style="padding-top:0;color:#6b7280">해지 확인된 센터(지도에서 제거됨)</div><div class="ctx-item" id="stKeep">↩️ 복원 → 정상 표시</div>'
    : '<div class="ctx-item danger" id="stRemove">🚫 해지 확인 → 지도에서 제거</div>';   // 실적에 해지가 아직 반영되지 않은 센터도 담당자가 직접 제거
  openCtxBox(pt, head+stItems+'<div class="ctx-item" id="cpMove">📌 위치 옮기기</div>'+(c.adj?'<div class="ctx-item danger" id="cpReset">↩️ 원래 위치로 되돌리기</div>':''));
  document.getElementById('cpMove').onclick = function(){ closeCtx(); startCenterMove(c); };
  const sr = document.getElementById('stRemove'); if(sr) sr.onclick = function(){ closeCtx(); setCenterStatus(c, 'removed'); };
  const sk = document.getElementById('stKeep'); if(sk) sk.onclick = function(){ closeCtx(); setCenterStatus(c, 'keep'); };
  const rb = document.getElementById('cpReset');
  if(rb) rb.onclick = async function(){
    if(!confirm(c.name+' 위치를 원본으로 되돌릴까요?')) return;
    try{ await postCall({action:'resetCenterPos', code:c.code}); c.lat=c.olat; c.lng=c.olng; c.adj=0; delete c.olat; delete c.olng; closeCtx(); renderMarkers(); }
    catch(e){ alert('되돌리기 실패: ' + e.message); }
  };
}
/* ── 해지 센터 확인 (서버 시트 map_status, 모두에게 반영) ──
   확인창(confirm)은 대시보드 안에서 브라우저가 막는 경우가 있어 쓰지 않고, 결과는 화면 상단 안내로 알린다 */
/* 확인창: 기본은 브라우저 확인창(위치 옮기기와 동일). 브라우저가 막아서 즉시 '취소'가 돌아오면 화면 안의 확인창으로 대신한다 */
function askConfirm(msg){
  const t0 = Date.now();
  const ok = confirm(msg);
  if(ok || Date.now() - t0 > 150) return Promise.resolve(ok);
  return new Promise(function(resolve){
    const bg = document.createElement('div');
    bg.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:99999;display:flex;align-items:center;justify-content:center';
    const box = document.createElement('div');
    box.style.cssText = 'background:#fff;border-radius:12px;padding:20px 22px;max-width:360px;font-size:14px;line-height:1.6;box-shadow:0 8px 30px rgba(0,0,0,.25)';
    box.innerHTML = '<div style="white-space:pre-line;margin-bottom:16px">'+esc(msg)+'</div><div style="text-align:right"><button class="tool-btn" id="acNo">취소</button> <button class="tool-btn" id="acYes" style="background:#2563eb;color:#fff">확인</button></div>';
    bg.appendChild(box); document.body.appendChild(bg);
    const done = function(v){ bg.remove(); resolve(v); };
    box.querySelector('#acYes').onclick = function(){ done(true); };
    box.querySelector('#acNo').onclick = function(){ done(false); };
  });
}
async function setCenterStatus(c, status){
  if(status === 'removed'){
    const ok = await askConfirm('"'+c.name+'"을(를) 해지 센터로 확인하고 지도에서 제거할까요?\n저장하면 지도를 보는 모든 사람에게 반영됩니다.\n(실수라면 "🚫 해지 센터 보기"에서 복원할 수 있습니다)');
    if(!ok) return;
  }
  try{
    if(!userEmail){   // 대시보드 밖에서 열었을 때: 누가 처리했는지 남기기 위해 한 번 물어본다
      try{ userEmail = (prompt('처리 기록에 남길 본인 이메일을 입력하세요') || '').trim(); }catch(e){}
    }
    await postCall({action:'setMapStatus', code:c.code, name:c.name, status:status, by:userEmail || '(이메일 미확인)'});
    if(status === 'removed'){ c.st = 'rem'; c.why = c.why || '해지 확인'; showStatus('🚫 "'+c.name+'"을(를) 지도에서 제거했습니다. (해지 센터 보기에서 복원할 수 있습니다)'); }
    else { delete c.st; delete c.why; showStatus('✅ "'+c.name+'"을(를) 정상 센터로 표시합니다.'); }
    try{ localStorage.removeItem('yoonsmap_centers_cache_v1'); }catch(e){}
    applyFilterAndRender(); syncClosedBtn();
    setTimeout(function(){ showStatus(''); }, 4000);
  }catch(e){ console.error(e); showStatus('⚠️ 저장 실패: ' + e.message, true); }
}
function syncClosedBtn(){
  const b = document.getElementById('tool-closed'); if(!b) return;
  const n = allCenters.filter(c=>c.st==='rem').length;
  b.classList.toggle('active', closedShown);
  b.textContent = '🚫 해지 센터 보기' + (n ? ' ('+n+')' : '');
}
function toggleClosedView(){
  closedShown = !closedShown; syncClosedBtn(); applyFilterAndRender();
}
function startCenterMove(c){
  cancelPlannedMove();
  _plannedMove = { id:c.code };
  showStatus('📌 "'+c.name+'" 마커 끝(뾰족한 곳)이 놓일 위치를 클릭하세요 (Esc 취소)');
  function onClick(e){
    const ll = e.latLng;
    const base = c.adj ? new kakao.maps.LatLng(c.olat, c.olng) : new kakao.maps.LatLng(c.lat, c.lng);
    const d = distanceMeters(new kakao.maps.LatLng(c.lat, c.lng), ll);
    cancelPlannedMove();
    if(distanceMeters(base, ll) > 3000){ alert('원본 위치에서 3km 넘게는 옮길 수 없습니다.'); return; }
    if(!confirm(c.name+' 위치를 '+formatDistance(d)+' 옮길까요?'+(d>=500?'\n※ 500m 이상 큰 이동입니다. 맞는지 확인해 주세요.':'')+'\n저장하면 지도를 보는 모든 사람에게 반영됩니다.')) return;
    const lat = Number(ll.getLat().toFixed(6)), lng = Number(ll.getLng().toFixed(6));
    postCall({action:'saveCenterPos', code:c.code, lat:lat, lng:lng}).then(function(){
      if(!c.adj){ c.olat = c.lat; c.olng = c.lng; }
      c.lat = lat; c.lng = lng; c.adj = 1; renderMarkers();
    }).catch(function(err){ alert('위치 저장 실패: ' + err.message); });
  }
  _plannedMove.off = function(){ kakao.maps.event.removeListener(map, 'click', onClick); };
  kakao.maps.event.addListener(map, 'click', onClick);
}

function openPlannedMenu(p, el){
  const wrap = document.getElementById('mapWrap');
  const r = el.getBoundingClientRect(), w = wrap.getBoundingClientRect();
  openCtxBox({x:r.left - w.left, y:r.bottom - w.top + 4},
    '<div class="ctx-body"><b>'+esc(p.name)+'</b> (개설 예정 · '+esc(bmDisplayLabel(p.form))+')'+(p.addr?'<br><span style="color:#6b7280;font-size:11.5px">'+esc(p.addr)+'</span>':'')+'</div>'+
    '<div class="ctx-item" id="plMove">📌 위치 옮기기</div><div class="ctx-item danger" id="plDel">🗑️ 삭제</div>');
  document.getElementById('plMove').onclick = function(){ closeCtx(); startPlannedMove(p); };
  document.getElementById('plDel').onclick = async function(){
    if(!confirm(p.name + ' 개설 예정지를 삭제할까요?')) return;
    try{ await postCall({action:'deletePlanned', id:p.id}); delete planned[p.id]; renderPlanned(); closeCtx(); }
    catch(e){ alert('삭제 실패: ' + e.message); }
  };
}
// 위치 옮기기: 지도에서 새 위치를 한 번 클릭하면 이동·저장 (Esc 취소)
function startPlannedMove(p){
  cancelPlannedMove();
  _plannedMove = { id:p.id };
  showStatus('📌 "'+p.name+'"을(를) 옮길 위치를 지도에서 클릭하세요 (Esc 취소)');
  function onClick(e){
    const ll = e.latLng, old = { lat:p.lat, lng:p.lng };
    p.lat = Number(ll.getLat().toFixed(6)); p.lng = Number(ll.getLng().toFixed(6));
    cancelPlannedMove(); renderPlanned();
    lookupAddress(ll).then(a=>{ p.addr = addrText(a) || p.addr; return postCall(Object.assign({action:'savePlanned'}, p)); })
      .catch(err=>{ alert('이동 저장 실패: ' + err.message); p.lat = old.lat; p.lng = old.lng; renderPlanned(); });
  }
  _plannedMove.off = function(){ kakao.maps.event.removeListener(map, 'click', onClick); };
  kakao.maps.event.addListener(map, 'click', onClick);
}
function cancelPlannedMove(){
  if(_plannedMove){ if(_plannedMove.off) _plannedMove.off(); _plannedMove = null; showStatus(''); }
}

async function init(){
  try{
    showStatus('내 위치를 확인하는 중…');
    const loc = await getUserLocation(6000); // 6초 안에 응답 없으면 포기하고 전체 화면으로 시작

    showStatus('카카오 지도를 불러오는 중…');
    map = await loadKakaoMapAndCreate(loc);

    if(location.search.includes('nomarker')){
      showStatus('🔧 진단 모드 — 마커 없이 지도만 표시 중');
      document.getElementById('countLabel').textContent = '진단 모드(마커 미표시)';
      return;
    }

    kakao.maps.event.addListener(map, 'idle', function(){ renderMarkers(); renderTerritories(); });
    document.getElementById('map').addEventListener('contextmenu', e=>e.preventDefault()); // 브라우저 기본 우클릭 메뉴 막기
    kakao.maps.event.addListener(map, 'rightclick', function(e){
      if(currentTool || terrDrawing || _plannedMove) return;   // 그리는 중에는 메뉴를 띄우지 않는다
      openMapMenu(e.latLng, e.point);
    });
    ['click','dragstart','zoom_start'].forEach(ev=>kakao.maps.event.addListener(map, ev, closeCtx));

    showStatus('센터 데이터를 불러오는 중…');
    allCenters = await fetchCenters();
    showStatus('');

    if(!allCenters.length){
      showStatus('표시할 센터가 없습니다 — Google Sheet에 좌표(K·L열)가 채워졌는지 확인해 주세요.', true);
    }
    buildBmFilters();
    visibleCenters = allCenters.filter(centerShown);
    updateCountLabel();
    setTimeout(renderMarkers, 100);
    initAuth();
  }catch(e){
    showStatus('⚠️ ' + e.message, true);
    console.error(e);
  }
}
init();
</script>
